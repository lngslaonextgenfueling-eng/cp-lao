# Local development only: just PostgreSQL on localhost:5432.
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pcshop
      POSTGRES_PASSWORD: pcshop
      POSTGRES_DB: pcshop
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
volumes:
  pgdata_dev:
